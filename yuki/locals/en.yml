    <i>Find love and grow together~</i>
  page_3: |
    :sparkle: <b>New Features :dot2: 3/4</b>

    :trophy: <b>Games & Rankings</b>
    <blockquote>
    :dot2: /gacha — Pull a companion
    :dot2: /collection — View your companions
    :dot2: /newgrid — Play Word Grid (find hidden words!)
    :dot2: /wordgridrankings — Word Grid leaderboard
