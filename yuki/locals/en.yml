    :dot2: /qt — Create a quote sticker (reply)

    </blockquote>
    <i>Solve word puzzles in your groups too!</i>
  page_4: |
    :sparkle: <b>New Features :dot2: 4/4</b>

    :gem: <b>Profile & Rewards</b>
    <blockquote>
    :dot2: /profile — Your full profile card
    :dot2: /withdraw — Redeem coins for real rewards

    </blockquote>
    <i>Your grind actually pays off here~</i>

ping:
  response: |
    :ping: <b>Pong!</b>

    :zap: <b>Latency:</b> {latency} ms
    :whiteheart: <b>Status:</b> Online
    :rocket: <b>Everything is running smoothly.</b>

health:
  response: |
    :greenheart: <b>System Health</b>

    <blockquote>
    :bot: Bot Status : Online
    :database: Database : {db_status}
    :signal: API : Connected
    :brain: Memory : {memory} MB
    :clock: Uptime : {uptime}

    </blockquote>

    <i>All systems are operating normally.</i>

stats:
  response: |
    :chart: <b>Yuki Statistics</b>

    <blockquote>
    :user: Users : {users}
    :chat: Groups : {groups}
    :mail: Messages Today : {messages}
    :gift: Gifts Sent : {gifts}
    :cute: Stickers Saved : {stickers}

    </blockquote>

    <i>Thank you for making Yuki a part of your chats. :heart:</i>

active:
  response: |
    :star: <b>Most Active Members</b>

    <blockquote>
    {user_list}
    </blockquote>

    :users: <b>Total Active Members:</b> {count}

gifts:
  sent: |
    :gift: <b>Gift Delivered!</b>

    {sender} sent <b>{gift}</b> {emoji} to {receiver}.

    <i>{desc}</i>

  received: |
    :pinkgift: <b>You Received a Gift!</b>

    {sender} surprised you with a <b>{gift}</b> {emoji}

    <i>{desc}</i>

  my_gifts: |
    :ribbon: <b>Your Gift Collection</b>

    {gift_list}

    :heart: <b>Total Gifts:</b> {count}

me:
  profile: |
    :flower: <b>Your Profile</b>

    <blockquote>
    :user: Name : {name}
    :id: ID : {user_id}
    :chat: Messages : {messages}
    :calendar: Joined : {joined}
    :trophy: Rank : #{rank}
    :gift: Gifts : {gifts}
    </blockquote>

    {gift_display}

broadcast:
  success: |
    :success: Broadcast completed successfully.

    :mail: Delivered to <b>{count}</b> users.

  fail: |
    :warning: Failed to deliver to <b>{failed}</b> users.

maintenance:
  on: |
    :settings: <b>Maintenance Mode ON</b>

    Yuki is currently receiving improvements. Please wait a little~ :heart:

  off: |
    :success: <b>Maintenance Mode OFF</b>

    Yuki is back online and ready to chat again :flower:

errors:
  maintenance: ":settings: Yuki is currently under maintenance. Please try again in a little while. :heart:"
  owner_only: ":crown: Only my developer can use this command."
  admin_only: ":shield: This command is available only for group administrators."
  not_found: ":search: I couldn't find that user."
  no_reply: ":reply: Please reply to a user's message first."
  group_only: ":users: This command can only be used inside groups."

chat:
  greetings:
    - "Welcome back! I was waiting for you. :flower:"
    - "Aww~ You're here! My day just got better. :heart:"
    - "Hi there! Ready for another lovely conversation? :sparkle:"
    - "It's always nice seeing you again. :pinkheart:"
    - "Yay! Let's make today a wonderful one together. :flower2:"

  reactions:
    - "That made me smile. :heart:"
    - "You're absolutely adorable. :flower:"
    - "Hehe~ I really like that! :sparkle:"
    - "Aww, that's so sweet of you. :cute:"
    - "You're making my day brighter. :pinkheart:"

  bored:
    - "It's a little quiet... let's talk! :flower:"
    - "I'm still here whenever you need me. :heart:"
    - "Don't leave me waiting too long~ :sad:"
    - "Come say hi! I have plenty of stories to tell. :sparkle:"
    - "Every conversation with you is my favorite. :pinkheart:"
